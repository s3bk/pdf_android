[package]
name = "pdf_android"
version = "0.9.0"
edition = "2021"
publish = false

# The `.so` has to be called `libmain.so` for NativeActivity: the manifest names
# it with `android.app.lib_name`.
[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
# `pdf` is the fork this viewer needs, and it has to be spelled exactly as
# pdf_render spells it: two source entries for one crate (a branch here, a rev
# there) is two `pdf` crates in the tree and two incompatible sets of types
# (`Page`, `Resolve`, `Transform2F`). The locked revision is in Cargo.lock, so
# the tag still pins what it built with. Over https, anonymously, as pdf_render's manifest is.
pdf = { git = "https://github.com/s3bk/pdf.git", branch = "master", default-features = false, features = ["cache", "dump"] }
pdf_render = { git = "https://github.com/s3bk/pdf_render.git", rev = "075ea2607cc029a23ee2965c90059002e1981755", default-features = false, features = ["vello"] }
# The same font parser `pdf` uses, at the same revision, so the UI can borrow
# its glyph outlines instead of pulling in a second text stack.
font = { git = "https://github.com/pdf-rs/font", rev = "032f427839837c6e1fac7333bd4039d3482d17a7" }
vello = "=0.11.0"
# TLS for reading a PDF straight off a URL: the NDK has no TLS stack, and there
# is no Java in the APK to borrow `HttpsURLConnection` from.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
# Reading the intent the launcher handed us: `getIntent().getData()` and
# `ContentResolver.openInputStream()` are Java, and there is no Java in the APK.
jni = "0.21"

# Sized for the APK, not for a benchmark: the .so is the whole download.
#   * opt-level 3, NOT "z": "z" was tried and it cost the phone half its frame
#     rate and seconds of startup — the PDF parser, the glyph cache and the
#     scene builder are all CPU code. The symbol strip is where the megabytes
#     actually were, so this costs little size and keeps the speed.
#   * fat LTO + one codegen unit: cross-crate inlining, and generic code (vello,
#     kurbo, rustls) is instantiated once instead of in every crate.
#   * panic = abort: no landing pads, no backtrace machinery.
#   * strip: symbols are ~6 MB of the 23 MB unstripped .so.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# The phone build is the one that has to keep up with a finger: spell out the
# three things `release` should already imply, so a later profile tweak for size
# cannot quietly put a bounds check or a stack probe back into the hot loop.
debug-assertions = false
overflow-checks = false
incremental = false
